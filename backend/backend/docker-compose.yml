services:
  db:
    image: postgres:16-alpine
    container_name: fg-debt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fg_debt_advice
    ports:
      - "5432:5432"
    volumes:
      - fg_debt_pgdata:/var/lib/postgresql/data

volumes:
  fg_debt_pgdata:
